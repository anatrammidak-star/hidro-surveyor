name: Build Release APK Gratis

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate Clean App & Build
        run: |
          # 1. Buat project baru fresh
          flutter create hydro_app --org id.go.menlhk --project-name hydro_surveyor
          cd hydro_app

          # 2. Pasang dependensi yang stabil (buang plugin yang bikin crash gradle)
          flutter pub add geolocator image flutter_image_compress sqflite path pdf printing signature intl http camera

          # 3. Kunci compileSdk 34 & minSdk 21 di android/app/build.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

          # 4. Injeksi compileSdkVersion 34 ke seluruh subproject agar semua library patuh
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

          # 5. Salin kode aplikasi (lib) ke project baru jika tersedia
          if [ -d "../lib" ]; then
            cp -r ../lib/* lib/
          fi

          # 6. Kompilasi APK Release
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: hydro_app/build/app/outputs/flutter-apk/app-release.apk
