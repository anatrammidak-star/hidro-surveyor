name: Build HydroSurveyor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =====================================================
      # 2. SETUP FLUTTER
      # =====================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      # =====================================================
      # 3. CHECK FLUTTER
      # =====================================================
      - name: Check Flutter Environment
        run: |
          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"
          flutter --version

          echo ""
          echo "========================================"
          echo "DART VERSION"
          echo "========================================"
          dart --version

      # =====================================================
      # 4. CHECK ORIGINAL PROJECT
      # =====================================================
      - name: Check Project Structure
        run: |
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "ANDROID FILES BEFORE REPAIR"
          echo "========================================"
          find android -maxdepth 4 -type f 2>/dev/null | sort || true

      # =====================================================
      # 5. BACKUP CUSTOM ANDROID SOURCE
      # =====================================================
      - name: Backup Android Source
        run: |
          if [ -d "android/app/src/main" ]; then
            echo "Backing up existing Android source..."

            mkdir -p /tmp/hydro_android_backup

            cp -r android/app/src/main \
              /tmp/hydro_android_backup/main

            echo "Android source backup completed."
          else
            echo "No existing android/app/src/main found."
          fi

      # =====================================================
      # 6. GENERATE COMPLETE ANDROID PROJECT
      # =====================================================
      - name: Generate Android Project
        run: |
          echo "========================================"
          echo "GENERATING ANDROID PLATFORM"
          echo "========================================"

          # Remove incomplete Android project.
          # lib/ and pubspec.yaml remain untouched.
          rm -rf android

          flutter create \
            --platforms=android \
            --org id.go.menlhk \
            --project-name hydro_surveyor \
            .

          echo ""
          echo "Android project generated."

      # =====================================================
      # 7. RESTORE CUSTOM ANDROID SOURCE
      # =====================================================
      - name: Restore Android Source
        run: |
          if [ -d "/tmp/hydro_android_backup/main" ]; then

            echo "Restoring original Android source..."

            rm -rf android/app/src/main

            cp -r /tmp/hydro_android_backup/main \
              android/app/src/main

            echo "Original Android source restored."

          else
            echo "No custom Android source to restore."
          fi

      # =====================================================
      # 8. SETUP JAVA 17
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # 9. CHECK JAVA / GRADLE STRUCTURE
      # =====================================================
      - name: Check Android Build System
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"
          find android -maxdepth 4 -type f | sort

          echo ""
          echo "========================================"
          echo "APP BUILD.GRADLE"
          echo "========================================"
          cat android/app/build.gradle

      # =====================================================
      # 10. CONFIGURE ANDROID SDK
      # =====================================================
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle tidak ditemukan."
              )

          text = path.read_text()

          replacements = {
              "compileSdk = flutter.compileSdkVersion":
                  "compileSdk = 35",

              "compileSdkVersion flutter.compileSdkVersion":
                  "compileSdkVersion 35",

              "targetSdk = flutter.targetSdkVersion":
                  "targetSdk = 35",

              "targetSdkVersion flutter.targetSdkVersion":
                  "targetSdkVersion 35",

              "minSdk = flutter.minSdkVersion":
                  "minSdk = 21",

              "minSdkVersion flutter.minSdkVersion":
                  "minSdkVersion 21",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          print("Android SDK configuration updated.")
          PY

      # =====================================================
      # 11. LOCK GEOLOCATOR VERSION
      # =====================================================
      - name: Lock Geolocator Version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_text()

          text = text.replace(
              "geolocator: ^10.1.0",
              "geolocator: 10.1.0"
          )

          path.write_text(text)

          print("Geolocator locked to 10.1.0")
          PY

      # =====================================================
      # 12. FLUTTER CLEAN
      # =====================================================
      - name: Flutter Clean
        run: |
          flutter clean

      # =====================================================
      # 13. GET DEPENDENCIES
      # =====================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # =====================================================
      # 14. CHECK DEPENDENCIES
      # =====================================================
      - name: Check Dependencies
        run: |
          echo "========================================"
          echo "DEPENDENCY TREE"
          echo "========================================"

          flutter pub deps --style=compact

      # =====================================================
      # 15. BUILD RELEASE APK
      # =====================================================
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

      # =====================================================
      # 16. VERIFY APK
      # =====================================================
      - name: Verify APK
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "========================================"
          echo "HYDROSURVEYOR APK BUILD SUCCESSFUL"
          echo "========================================"

      # =====================================================
      # 17. UPLOAD APK
      # =====================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
