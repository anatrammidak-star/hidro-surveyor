name: Build Release APK Gratis

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Clean App & Build
        run: |
          # 1. Buat direktori project baru yang fresh
          flutter create hydro_app --org id.go.menlhk --project-name hydro_surveyor
          cd hydro_app

          # 2. Pasang plugin yang dibutuhkan
          flutter pub add camera geolocator image flutter_image_compress sqflite path pdf printing signature intl http

          # 3. Kunci minSdkVersion ke 21 di file gradle
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

          # 4. Salin kode aplikasi (lib) ke project baru jika tersedia
          if [ -d "../lib" ]; then
            cp -r ../lib/* lib/
          fi

          # 5. Kompilasi APK Release
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: hydro_app/build/app/outputs/flutter-apk/app-release.apk
