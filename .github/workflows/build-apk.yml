name: Build HydroSurveyor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Environment
        run: |
          flutter --version
          dart --version
          java -version

      # =====================================================
      # Generate complete Android project if necessary
      # =====================================================
      - name: Prepare Android Project
        run: |
          if [ ! -f "android/app/build.gradle" ]; then

            echo "Android project incomplete."
            echo "Generating Flutter Android project..."

            if [ -d "android/app/src/main" ]; then
              mkdir -p /tmp/hydro_android_backup
              cp -r android/app/src/main /tmp/hydro_android_backup/main
            fi

            rm -rf android

            flutter create \
              --platforms=android \
              --org id.go.menlhk \
              --project-name hydro_surveyor \
              .

            if [ -d "/tmp/hydro_android_backup/main" ]; then
              rm -rf android/app/src/main
              cp -r /tmp/hydro_android_backup/main \
                android/app/src/main
            fi

          else
            echo "Android project already exists."
          fi

      # =====================================================
      # Configure Android
      # =====================================================
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          text = path.read_text()

          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 35"
          )

          text = text.replace(
              "compileSdkVersion flutter.compileSdkVersion",
              "compileSdkVersion 35"
          )

          text = text.replace(
              "targetSdk = flutter.targetSdkVersion",
              "targetSdk = 35"
          )

          text = text.replace(
              "targetSdkVersion flutter.targetSdkVersion",
              "targetSdkVersion 35"
          )

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 21"
          )

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 21"
          )

          path.write_text(text)
          PY

      # =====================================================
      # Clean old dependency state
      # =====================================================
      - name: Clean Flutter
        run: |
          flutter clean
          rm -f pubspec.lock

      # =====================================================
      # Resolve dependencies
      # =====================================================
      - name: Get Dependencies
        run: |
          flutter pub get

      # =====================================================
      # VERIFY GEOLOCATOR VERSION
      # =====================================================
      - name: Verify Geolocator
        run: |
          echo "========================================"
          echo "GEOLOCATOR DEPENDENCIES"
          echo "========================================"

          flutter pub deps --style=compact | grep -E \
            "geolocator|geolocator_android" || true

          echo ""
          echo "Checking resolved version..."

          grep -A5 -B2 \
            "geolocator_android:" \
            pubspec.lock || true

      # =====================================================
      # Build APK
      # =====================================================
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # =====================================================
      # Verify
      # =====================================================
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk

      # =====================================================
      # Upload
      # =====================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
