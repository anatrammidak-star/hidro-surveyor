name: Build Release APK Gratis

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Inisialisasi Android Wrapper & Project Files
        run: |
          # Perintahkan Flutter menyusun ulang folder android lengkap versi modern
          flutter create . --org id.go.menlhk --project-name hydro_surveyor
          
          # Pasang MainActivity Android Embedding v2 secara otomatis
          mkdir -p android/app/src/main/kotlin/id/go/menlhk/hydro_surveyor
          cat << 'EOF' > android/app/src/main/kotlin/id/go/menlhk/hydro_surveyor/MainActivity.kt
          package id.go.menlhk.hydro_surveyor

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Ambil Dependencies
        run: flutter pub get

      - name: Compile APK Release Universal
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: build/app/outputs/flutter-apk/app-release.apk
