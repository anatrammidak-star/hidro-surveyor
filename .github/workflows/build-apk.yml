name: Build HydroSurveyor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =====================================================
      # Setup Flutter
      # =====================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      # =====================================================
      # Setup Java
      # =====================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # Check Environment
      # =====================================================
      - name: Check Environment
        run: |
          flutter --version
          dart --version
          java -version

      # =====================================================
      # Prepare Android Project
      # =====================================================
      - name: Prepare Android Project
        run: |
          if [ ! -f "android/app/build.gradle" ]; then

            echo "========================================"
            echo "Android project incomplete."
            echo "Generating complete Flutter Android project."
            echo "========================================"

            # Backup existing custom Android source
            if [ -d "android/app/src/main" ]; then
              mkdir -p /tmp/hydro_android_backup
              cp -R android/app/src/main \
                /tmp/hydro_android_backup/main
            fi

            # Remove incomplete Android project
            rm -rf android

            # Generate complete Android project
            flutter create \
              --platforms=android \
              --org id.go.menlhk \
              --project-name hydro_surveyor \
              .

            # =================================================
            # MERGE custom source into generated Android project
            # =================================================
            if [ -d "/tmp/hydro_android_backup/main" ]; then

              echo "Merging existing custom Android source..."

              cp -R /tmp/hydro_android_backup/main/. \
                android/app/src/main/

            fi

          else
            echo "Android project already exists."
          fi

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT STRUCTURE"
          echo "========================================"

          find android/app/src/main \
            -maxdepth 3 \
            -type f | sort

      # =====================================================
      # Configure Android SDK
      # =====================================================
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle tidak ditemukan."
              )

          text = path.read_text()

          replacements = {
              "compileSdk = flutter.compileSdkVersion":
                  "compileSdk = 35",

              "compileSdkVersion flutter.compileSdkVersion":
                  "compileSdkVersion 35",

              "targetSdk = flutter.targetSdkVersion":
                  "targetSdk = 35",

              "targetSdkVersion flutter.targetSdkVersion":
                  "targetSdkVersion 35",

              "minSdk = flutter.minSdkVersion":
                  "minSdk = 21",

              "minSdkVersion flutter.minSdkVersion":
                  "minSdkVersion 21",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)
          PY

          echo ""
          echo "========================================"
          echo "ANDROID SDK CONFIGURATION"
          echo "========================================"

          grep -E \
            "compileSdk|targetSdk|minSdk" \
            android/app/build.gradle || true

      # =====================================================
      # Configure Permanent Release Signing
      # =====================================================
      - name: Configure Permanent Release Signing
        env:
          HYDRO_KEYSTORE_BASE64: ${{ secrets.HYDRO_KEYSTORE_BASE64 }}
          HYDRO_KEYSTORE_PASSWORD: ${{ secrets.HYDRO_KEYSTORE_PASSWORD }}
          HYDRO_KEY_ALIAS: ${{ secrets.HYDRO_KEY_ALIAS }}
          HYDRO_KEY_PASSWORD: ${{ secrets.HYDRO_KEY_PASSWORD }}
        run: |
          echo "========================================"
          echo "CONFIGURING PERMANENT RELEASE SIGNING"
          echo "========================================"

          # -------------------------------------------------
          # Check secrets
          # -------------------------------------------------
          if [ -z "$HYDRO_KEYSTORE_BASE64" ]; then
            echo "ERROR: HYDRO_KEYSTORE_BASE64 tidak tersedia."
            exit 1
          fi

          if [ -z "$HYDRO_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: HYDRO_KEYSTORE_PASSWORD tidak tersedia."
            exit 1
          fi

          if [ -z "$HYDRO_KEY_ALIAS" ]; then
            echo "ERROR: HYDRO_KEY_ALIAS tidak tersedia."
            exit 1
          fi

          if [ -z "$HYDRO_KEY_PASSWORD" ]; then
            echo "ERROR: HYDRO_KEY_PASSWORD tidak tersedia."
            exit 1
          fi

          # -------------------------------------------------
          # Restore keystore
          # -------------------------------------------------
          echo "$HYDRO_KEYSTORE_BASE64" | \
            base64 --decode > android/app/hydro-release.jks

          test -s android/app/hydro-release.jks

          echo "Release keystore berhasil dipulihkan."

          # -------------------------------------------------
          # Create key.properties
          # -------------------------------------------------
          cat > android/key.properties <<EOF
          storePassword=$HYDRO_KEYSTORE_PASSWORD
          keyPassword=$HYDRO_KEY_PASSWORD
          keyAlias=$HYDRO_KEY_ALIAS
          storeFile=hydro-release.jks
          EOF

          echo "key.properties berhasil dibuat."

          # -------------------------------------------------
          # Configure build.gradle
          # -------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # -----------------------------------------------
          # Add imports / keystore properties
          # -----------------------------------------------
          properties_block = '''
          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = text.replace(
                  "android {",
                  properties_block + "\nandroid {",
                  1
              )

          # -----------------------------------------------
          # Add release signing config
          # -----------------------------------------------
          signing_config = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ?
                          file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "buildTypes {",
                  signing_config + "\n    buildTypes {",
                  1
              )

          # -----------------------------------------------
          # Make release use permanent key
          # -----------------------------------------------
          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          # -----------------------------------------------
          # If no release signing was found, inject it
          # -----------------------------------------------
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "release {",
                  """release {
                  signingConfig signingConfigs.release""",
                  1
              )

          path.write_text(text)
          PY

          echo ""
          echo "========================================"
          echo "SIGNING CONFIGURATION"
          echo "========================================"

          grep -n -A15 -B3 \
            "signingConfigs" \
            android/app/build.gradle || true

          echo ""
          echo "========================================"
          echo "RELEASE BUILD TYPE"
          echo "========================================"

          grep -n -A10 \
            "buildTypes" \
            android/app/build.gradle || true

      # =====================================================
      # Verify Release Keystore
      # =====================================================
      - name: Verify Release Keystore
        env:
          HYDRO_KEYSTORE_PASSWORD: ${{ secrets.HYDRO_KEYSTORE_PASSWORD }}
          HYDRO_KEY_ALIAS: ${{ secrets.HYDRO_KEY_ALIAS }}
        run: |
          echo "========================================"
          echo "VERIFYING RELEASE KEYSTORE"
          echo "========================================"

          keytool -list \
            -keystore android/app/hydro-release.jks \
            -storepass "$HYDRO_KEYSTORE_PASSWORD" \
            -alias "$HYDRO_KEY_ALIAS"

          echo "Release keystore valid."

      # =====================================================
      # Check Android Resources
      # =====================================================
      - name: Check Android Resources
        run: |
          echo "========================================"
          echo "CHECKING ANDROID RESOURCES"
          echo "========================================"

          echo ""
          echo "Launcher resources:"
          find android/app/src/main/res \
            -type f | grep -E \
            "ic_launcher|launcher" || true

          echo ""
          echo "Theme resources:"
          find android/app/src/main/res \
            -type f | grep -E \
            "styles.xml|themes.xml|launch" || true

          echo ""
          echo "AndroidManifest:"
          test -f android/app/src/main/AndroidManifest.xml

          echo "AndroidManifest.xml OK"

      # =====================================================
      # Clean Flutter
      # =====================================================
      - name: Clean Flutter
        run: |
          flutter clean

      # =====================================================
      # Resolve Dependencies
      # =====================================================
      - name: Get Dependencies
        run: |
          flutter pub get

      # =====================================================
      # Verify Geolocator
      # =====================================================
      - name: Verify Geolocator
        run: |
          echo "========================================"
          echo "GEOLOCATOR DEPENDENCIES"
          echo "========================================"

          flutter pub deps --style=compact | \
            grep -E "geolocator|geolocator_android" || true

          echo ""
          echo "========================================"
          echo "PUBSPEC LOCK"
          echo "========================================"

          sed -n '/geolocator:/,/^[^ ]/p' pubspec.lock || true

          echo ""
          echo "========================================"
          echo "GEOLOCATOR ANDROID"
          echo "========================================"

          sed -n '/geolocator_android:/,/^[^ ]/p' pubspec.lock || true

      # =====================================================
      # Build APK
      # =====================================================
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # =====================================================
      # Verify APK
      # =====================================================
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "========================================"
          echo "APK BERHASIL DIBUAT"
          echo "========================================"

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk

      # =====================================================
      # Verify APK Signature
      # =====================================================
      - name: Verify APK Signature
        run: |
          echo "========================================"
          echo "VERIFYING APK SIGNATURE"
          echo "========================================"

          apksigner verify \
            --verbose \
            build/app/outputs/flutter-apk/app-release.apk

          echo "APK signature verification OK."

      # =====================================================
      # Upload APK
      # =====================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
