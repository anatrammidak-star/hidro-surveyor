name: Build Release APK Gratis

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Inisialisasi Android Wrapper, Update Kotlin 1.9.22 & minSdkVersion 21
        run: |
          # 1. Generate struktur android standar
          flutter create . --org id.go.menlhk --project-name hydro_surveyor --platforms android
          
          # 2. Update versi Kotlin ke 1.9.22 di android/build.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/g" android/build.gradle
          
          # 3. Patch minSdkVersion di android/app/build.gradle ke 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle

          # 4. Berikan izin eksekusi gradlew
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Ambil Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HydroSurveyor-v1.0-Release
          path: build/app/outputs/flutter-apk/app-release.apk
