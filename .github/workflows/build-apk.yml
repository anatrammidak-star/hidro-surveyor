name: Build HydroSurveyor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Check environment
        run: |
          flutter --version
          dart --version
          java -version

      # The repository's Android scaffold is incomplete. Generate a fresh
      # Kotlin DSL scaffold, while preserving the project's custom Android source.
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android Kotlin DSL scaffold is missing; regenerating it."

            backup_dir="$RUNNER_TEMP/sica_android_backup"
            rm -rf "$backup_dir"
            mkdir -p "$backup_dir"

            if [ -d "android/app/src/main" ]; then
              cp -R android/app/src/main "$backup_dir/main"
            fi

            rm -rf android

            flutter create \
              --platforms=android \
              --org id.go.menlhk \
              --project-name hydro_surveyor \
              .

            if [ -d "$backup_dir/main" ]; then
              cp -R "$backup_dir/main/." android/app/src/main/
            fi
          fi

          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configure Android identity and SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()

          def replace_one(pattern, replacement, source, label):
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"ERROR: tidak dapat mengatur {label} pada build.gradle.kts")
              return updated

          text = replace_one(
              r'^\s*namespace\s*=\s*"[^"]+"',
              '    namespace = "id.go.menlhk.hydro_surveyor"',
              text,
              "namespace",
          )
          text = replace_one(
              r'^\s*applicationId\s*=\s*"[^"]+"',
              '        applicationId = "id.go.menlhk.hydro_surveyor"',
              text,
              "applicationId",
          )
          text = replace_one(
              r'^\s*compileSdk\s*=\s*.*$',
              '    compileSdk = 36',
              text,
              "compileSdk",
          )
          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          updated, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="SiCA - Survei Cepat Air"',
              manifest_text,
              count=1,
          )
          if count == 0:
              raise SystemExit("ERROR: android:label tidak ditemukan di AndroidManifest.xml")
          manifest.write_text(updated)

          print("namespace/applicationId: id.go.menlhk.hydro_surveyor")
          print("compileSdk: 36")
          print("launcher label: SiCA - Survei Cepat Air")
          PY

          echo "---- Android Gradle configuration ----"
          grep -E 'namespace|applicationId|compileSdk|targetSdk|minSdk' android/app/build.gradle.kts

      - name: Restore and verify permanent release keystore
        shell: bash
        env:
          HYDRO_KEYSTORE_BASE64: ${{ secrets.HYDRO_KEYSTORE_BASE64 }}
          HYDRO_KEYSTORE_PASSWORD: ${{ secrets.HYDRO_KEYSTORE_PASSWORD }}
          HYDRO_KEY_ALIAS: ${{ secrets.HYDRO_KEY_ALIAS }}
          HYDRO_KEY_PASSWORD: ${{ secrets.HYDRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$HYDRO_KEYSTORE_BASE64" || { echo "ERROR: secret HYDRO_KEYSTORE_BASE64 tidak tersedia"; exit 1; }
          test -n "$HYDRO_KEYSTORE_PASSWORD" || { echo "ERROR: secret HYDRO_KEYSTORE_PASSWORD tidak tersedia"; exit 1; }
          test -n "$HYDRO_KEY_ALIAS" || { echo "ERROR: secret HYDRO_KEY_ALIAS tidak tersedia"; exit 1; }
          test -n "$HYDRO_KEY_PASSWORD" || { echo "ERROR: secret HYDRO_KEY_PASSWORD tidak tersedia"; exit 1; }

          echo "$HYDRO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hydro-release.jks"
          test -s "$RUNNER_TEMP/hydro-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/hydro-release.jks" \
            -storepass "$HYDRO_KEYSTORE_PASSWORD" \
            -alias "$HYDRO_KEY_ALIAS"

          echo "Keystore tersedia dan alias valid."

      - name: Resolve dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Show resolved dependency versions
        run: |
          flutter pub deps --style=compact | grep -E 'workmanager|file_picker|geolocator|geolocator_android' || true
          echo "---- Version from pubspec ----"
          grep -E '^version:' pubspec.yaml

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release --no-tree-shake-icons
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Align and sign APK with permanent release key
        shell: bash
        env:
          HYDRO_KEYSTORE_BASE64: ${{ secrets.HYDRO_KEYSTORE_BASE64 }}
          HYDRO_KEYSTORE_PASSWORD: ${{ secrets.HYDRO_KEYSTORE_PASSWORD }}
          HYDRO_KEY_ALIAS: ${{ secrets.HYDRO_KEY_ALIAS }}
          HYDRO_KEY_PASSWORD: ${{ secrets.HYDRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/hydro-release.jks"

          BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          TMP_DIR="$RUNNER_TEMP/sica_apk_signing"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          "$ZIPALIGN" -f -p 4 "$APK" "$TMP_DIR/app-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$HYDRO_KEY_ALIAS" \
            --ks-pass env:HYDRO_KEYSTORE_PASSWORD \
            --key-pass env:HYDRO_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$TMP_DIR/app-release-signed.apk" \
            "$TMP_DIR/app-aligned.apk"

          mv "$TMP_DIR/app-release-signed.apk" "$APK"

          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "---- APK package and launcher label ----"
          "$AAPT" dump badging "$APK" | grep -E "package: name=|application-label="

          PACKAGE_NAME="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ "$PACKAGE_NAME" != "id.go.menlhk.hydro_surveyor" ]; then
            echo "ERROR: applicationId APK tidak sesuai: $PACKAGE_NAME"
            exit 1
          fi

          echo "APK sudah ditandatangani dan identitas paket cocok."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SiCA-v1.0.2-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
