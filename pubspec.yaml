publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  image: ^4.1.7
  flutter_image_compress: ^2.1.8
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  pdf: ^3.10.8
  printing: ^5.12.0
  signature: ^5.3.3
  intl: ^0.19.0
  workmanager: ^0.5.2
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  geolocator_android: 4.6.1
